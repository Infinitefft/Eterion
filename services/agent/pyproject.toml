# 定义 Python Agent 项目的依赖、构建方式和测试配置。
[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "eterion-agent"
version = "0.1.0"
description = "Eterion LangGraph agent service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "grpcio==1.82.1",
    "protobuf==7.35.1",
    "langgraph==1.2.9",
    "langchain-openai==1.3.5",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools==1.82.1",
    "pytest==9.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
