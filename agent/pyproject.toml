[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eterion-agent"
version = "0.1.0"
description = "Agent runtime and orchestration service for Eterion"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "langchain-openai==1.5.1",
    "pydantic==2.13.4",
    "python-dotenv==1.2.3",
    "uvicorn==0.52.3",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]
orchestration = [
    "deepagents==0.7.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eterion_agent*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
